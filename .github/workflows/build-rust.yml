name: Build runet-fix-core

on:
  push:
    branches: [ "master" ]
    paths:
      - 'src/runet-fix/**'
      - 'src/tg-ws-proxy-rs/**'
      - '.github/workflows/build-rust.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            name: runet-fix-aarch64
            legacy_name: tg-ws-proxy-aarch64
            allow_fail: false
          - target: armv7-unknown-linux-musleabihf
            name: runet-fix-armv7
            legacy_name: tg-ws-proxy-armv7
            allow_fail: false
          - target: x86_64-unknown-linux-musl
            name: runet-fix-x86_64
            legacy_name: tg-ws-proxy-x86_64
            allow_fail: false
          - target: mipsel-unknown-linux-musl
            name: runet-fix-mipsel
            legacy_name: tg-ws-proxy-mipsel
            allow_fail: true
          - target: mips-unknown-linux-musl
            name: runet-fix-mips
            legacy_name: tg-ws-proxy-mips
            allow_fail: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Cross and UPX
        run: |
          curl -sL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | sudo tar xz -C /usr/local/bin
          sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Build target with cross
        continue-on-error: ${{ matrix.allow_fail }}
        run: |
          cd src/runet-fix
          cross build --target ${{ matrix.target }} --release

      - name: Compress and package binary
        continue-on-error: ${{ matrix.allow_fail }}
        run: |
          SRC="src/runet-fix/target/${{ matrix.target }}/release/runet-fix"
          DST="${{ matrix.name }}"
          LEGACY="${{ matrix.legacy_name }}"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DST"
            chmod +x "$DST"
            echo "Raw binary size:"
            ls -lh "$DST"
            upx --best "$DST" || true
            echo "Final compressed binary size:"
            ls -lh "$DST"
            cp "$DST" "$LEGACY"
          else
            echo "Binary not found, skipping packaging."
            touch "$DST"
            touch "$LEGACY"
          fi

      - name: Upload Core Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

      - name: Upload Legacy Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.legacy_name }}
          path: ${{ matrix.legacy_name }}
          if-no-files-found: error
