name: Build runet-fix-core

on:
  push:
    branches: [ "master" ]
    paths:
      - 'src/runet-fix/**'
      - 'files/**'
      - 'scripts/**'
      - 'prebuilt/**'
      - 'version'
      - 'Makefile'
      - 'README.md'
      - 'install.sh'
      - '.github/workflows/build-rust.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'src/runet-fix/**'
      - 'files/**'
      - 'scripts/**'
      - 'version'
      - 'Makefile'
      - 'README.md'
      - 'install.sh'
      - '.github/workflows/build-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/runet-fix

      - name: Install verification tools (shellcheck, gettext)
        run: sudo apt-get update && sudo apt-get install -y shellcheck gettext

      - name: Run unified verification suite (scripts/check.sh)
        run: sh scripts/check.sh

  build:
    name: Build ${{ matrix.name }}
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            name: runet-fix-aarch64
            legacy_name: tg-ws-proxy-aarch64
          - target: armv7-unknown-linux-musleabihf
            name: runet-fix-armv7
            legacy_name: tg-ws-proxy-armv7
          - target: x86_64-unknown-linux-musl
            name: runet-fix-x86_64
            legacy_name: tg-ws-proxy-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/runet-fix
          key: ${{ matrix.target }}

      - name: Install Cross and UPX
        run: |
          CROSS_URL="https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz"
          CROSS_EXPECTED="a486cefa6cb486971b97be321ea9dfc2e90c1979550295314a368f53fab6d588"
          curl -sL "$CROSS_URL" -o cross.tar.gz
          echo "$CROSS_EXPECTED  cross.tar.gz" | sha256sum -c -
          sudo tar xz -C /usr/local/bin -f cross.tar.gz
          rm -f cross.tar.gz
          sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Build target with cross
        run: |
          cd src/runet-fix
          cross build --target ${{ matrix.target }} --release

      - name: Compress and package binary
        run: |
          SRC="src/runet-fix/target/${{ matrix.target }}/release/runet-fix"
          DST="${{ matrix.name }}"
          LEGACY="${{ matrix.legacy_name }}"
          if [ ! -f "$SRC" ]; then
            echo "Binary not found: $SRC" >&2
            exit 1
          fi
          cp "$SRC" "$DST"
          chmod +x "$DST"
          if [ ! -s "$DST" ]; then
            echo "Binary is empty: $DST" >&2
            exit 1
          fi
          if ! file "$DST" | grep -q 'ELF'; then
            echo "Binary is not an ELF executable: $DST" >&2
            exit 1
          fi
          echo "Raw binary size:"
          ls -lh "$DST"
          if upx --best "$DST"; then
            echo "UPX compression succeeded."
          else
            echo "Warning: UPX compression did not reduce size; keeping uncompressed binary."
          fi
          echo "Final binary size:"
          ls -lh "$DST"
          cp "$DST" "$LEGACY"

      - name: Upload Core Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

      - name: Upload Legacy Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.legacy_name }}
          path: ${{ matrix.legacy_name }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [checks, build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          find artifacts -type f -exec cp {} release_assets/ \;
          cd release_assets
          sha256sum runet-fix-* tg-ws-proxy-* > SHA256SUMS
          chmod +x runet-fix-* tg-ws-proxy-* || true
          ls -lh

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/runet-fix-aarch64
            release_assets/runet-fix-armv7
            release_assets/runet-fix-x86_64
            release_assets/tg-ws-proxy-aarch64
            release_assets/tg-ws-proxy-armv7
            release_assets/tg-ws-proxy-x86_64
            release_assets/SHA256SUMS
          generate_release_notes: true

      - name: Sync updated prebuilt binaries to repository
        run: |
          mkdir -p prebuilt
          cp release_assets/runet-fix-* prebuilt/ 2>/dev/null || true
          cp release_assets/tg-ws-proxy-* prebuilt/ 2>/dev/null || true
          cp release_assets/SHA256SUMS prebuilt/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prebuilt/
          if ! git diff --cached --quiet; then
            git commit -m "prebuilt: sync release artifacts [skip ci]"
            git push origin master || true
          fi
