name: Build tg-ws-proxy-rs

on:
  push:
    branches: [ "master" ]
    paths:
      - 'src/tg-ws-proxy-rs/**'
      - '.github/workflows/build-rust.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            name: tg-ws-proxy-aarch64
          - target: armv7-unknown-linux-musleabihf
            name: tg-ws-proxy-armv7
          - target: mipsel-unknown-linux-musl
            name: tg-ws-proxy-mipsel
          - target: mips-unknown-linux-musl
            name: tg-ws-proxy-mips
          - target: x86_64-unknown-linux-musl
            name: tg-ws-proxy-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross and UPX
        run: |
          curl -sL https://github.com/cross-rs/cross/releases/download/v0.2.5/cross-x86_64-unknown-linux-musl.tar.gz | sudo tar xz -C /usr/local/bin
          sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Build target with cross
        run: |
          cd src/tg-ws-proxy-rs
          cross build --target ${{ matrix.target }} --release

      - name: Compress and package binary
        run: |
          SRC="src/tg-ws-proxy-rs/target/${{ matrix.target }}/release/tg-ws-proxy"
          DST="${{ matrix.name }}"
          cp "$SRC" "$DST"
          chmod +x "$DST"
          echo "Raw binary size:"
          ls -lh "$DST"
          upx --best "$DST" || true
          echo "Final compressed binary size:"
          ls -lh "$DST"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error
