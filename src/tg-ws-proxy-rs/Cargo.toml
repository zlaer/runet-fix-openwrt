[package]
name = "tg-ws-proxy"
version = "0.3.0"
edition = "2021"
authors = ["Senior Systems Engineer"]
description = "High-performance, ultra-low-memory Telegram Transparent Proxy & WebSocket Bridge for OpenWrt"

[dependencies]
# Async runtime tailored for minimal footprint on embedded routers
tokio = { version = "1.38", default-features = false, features = ["rt", "net", "time", "macros", "io-util", "sync"] }

# TLS stack without OpenSSL runtime dependency
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"

# Pure Rust Cryptography (zero dynamic dependencies, zero heap overhead)
aes = "0.8"
ctr = "0.9"
sha2 = "0.10"
hmac = "0.12"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }

# System socket options (SO_ORIGINAL_DST, SO_MARK)
libc = "0.2"

# Minimal logging
log = { version = "0.4", features = ["std"] }

# Lightweight CLI argument parsing (minimal binary footprint vs clap)
argh = "0.1"

# Base64 encoding for WebSocket handshake key
base64 = "0.22"

[profile.release]
opt-level = "z"       # Optimize strictly for size
lto = true            # Link-Time Optimization across all crates
codegen-units = 1     # Maximize LTO optimization scope
panic = "abort"       # Drop panic unwinding tables (saves ~300KB)
strip = true          # Strip all symbols and debug info from final ELF
